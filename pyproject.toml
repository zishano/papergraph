[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papergraph"
version = "0.1.0"
description = "Traceable seed resolution and bounded citation discovery"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3", "openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
papergraph = "papergraph.cli:main"

[tool.setuptools.packages.find]
include = ["papergraph*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
